name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'units/**'
      - 'live/**'
      - 'mise.toml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Terragrunt Apply
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Push events only apply units affected by what actually changed in
      # this push, matching the scope pr-validation.yml already planned.
      - name: Deploy (changed units only)
        if: github.event_name == 'push'
        run: |
          cd live
          terragrunt stack generate
          terragrunt run --all --filter "[${{ github.event.before }}...HEAD]" --non-interactive -- apply -auto-approve

      # Manual runs are an explicit "reconcile everything" escape hatch,
      # with no prior commit to diff against.
      - name: Deploy (full stack)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd live
          terragrunt stack run --non-interactive -- apply -auto-approve
